<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mindcraft — Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="description" content="Mindcraft control panel - manage agents & view logs" />
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="max-w-6xl mx-auto p-4">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-semibold">Mindcraft Control Panel</h1>
        <p class="text-sm text-gray-500">Manage agents, view logs, and monitor health</p>
      </div>
      <div class="flex items-center gap-3">
        <div id="health" class="px-3 py-2 bg-gray-100 rounded text-sm">Checking...</div>
        <button id="refreshBtn" class="px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Refresh</button>
        <button id="createBtn" class="px-3 py-2 bg-green-600 text-white rounded hover:bg-green-700">Create Agent</button>
      </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <section class="lg:col-span-2 bg-white rounded shadow p-4">
        <h2 class="font-medium mb-3">Agents</h2>
        <div class="overflow-x-auto">
          <table class="min-w-full table-auto text-sm">
            <thead>
              <tr class="text-left text-xs text-gray-500 border-b">
                <th class="py-2 px-2">Name</th>
                <th class="py-2 px-2">In Game</th>
                <th class="py-2 px-2">Viewer Port</th>
                <th class="py-2 px-2">Socket</th>
                <th class="py-2 px-2">Actions</th>
              </tr>
            </thead>
            <tbody id="agentsTbody" class="divide-y"></tbody>
          </table>
        </div>
      </section>

      <aside class="bg-white rounded shadow p-4">
        <h2 class="font-medium mb-3">Realtime Logs</h2>
        <div id="logs" class="h-64 overflow-auto bg-gray-50 p-2 text-xs rounded border"></div>
        <div class="mt-3">
          <button id="clearLogs" class="px-3 py-1 bg-gray-200 rounded text-sm">Clear</button>
        </div>
      </aside>

      <section class="lg:col-span-3 bg-white rounded shadow p-4">
        <h2 class="font-medium mb-3">Raw Socket Events</h2>
        <pre id="raw" class="text-xs bg-gray-100 p-2 rounded h-32 overflow-auto"></pre>
      </section>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
